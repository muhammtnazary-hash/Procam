name: ProCam
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  ProCam:
    type: application
    platform: iOS
    sources:
      - App.swift
      - Camera.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ProCam
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Kamera icin gerekli
        NSMicrophoneUsageDescription: Video sesi icin gerekli
        NSPhotoLibraryAddUsageDescription: Cekimleri galeriye kaydetmek icin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.procam
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
